{% extends 'movies/base.html' %}

{% block title %}Page non trouvée - CineExplorer{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div style="font-size: 120px; color: #f59e0b; margin-bottom: 20px;">
                <i class="fas fa-film"></i>
            </div>
            <h1 class="display-1" style="color: #999;">404</h1>
            <h2>Film non trouvé</h2>
            <p class="text-muted lead">Désolé, le film que vous recherchez n'existe pas dans notre base de données.</p>
            
            <div class="mt-4">
                <a href="{% url 'movies:index' %}" class="btn btn-primary btn-lg me-2">
                    <i class="fas fa-home"></i> Accueil
                </a>
                <a href="{% url 'movies:movies_list' %}" class="btn btn-secondary btn-lg">
                    <i class="fas fa-search"></i> Retour aux films
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }
</style>
{% endblock %}
